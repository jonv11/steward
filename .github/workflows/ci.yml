name: ci

on:
  push:
  pull_request:

jobs:
  build-test-pack:
    name: build-test-pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install Markdown lint dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm ci

      - name: Markdown lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint:md

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore steward.sln

      - name: Build
        run: dotnet build steward.sln -c Release --no-restore

      - name: Test
        run: dotnet test steward.sln -c Release --no-build

      - name: Steward check
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project src/Steward.Cli -c Release --no-build -- check

      - name: Pack
        run: dotnet pack src/Steward.Cli/Steward.Cli.csproj -c Release --no-build
