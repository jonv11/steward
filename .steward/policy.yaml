repository:
  name: steward
  description: Self-dogfooded .NET repository for the Steward CLI, its governing docs, and its test suite
  type: tool

artifacts:
  # Session-start entry points
  - path: README.md
    role: authoritative
    description: Project overview, contributor quick start, command reference, and primary entry point
    required: true
    importance: required

  - path: docs/implementation-status.md
    role: current-state
    description: Authoritative implementation snapshot, release readiness, and active gaps
    required: true
    importance: required
    freshness:
      max_age_days: 30

  - path: docs/planning-index.md
    role: guide
    description: Central navigation hub for requirements, decisions, planning, and audits
    index_of: docs
    required: true
    importance: required

  - path: docs/requirements/PRD.md
    role: vision
    description: Canonical product requirements document and living product contract
    required: true
    importance: required

  - path: docs/decisions/decision-index.md
    role: decision-log
    description: Index of accepted RFCs and ADRs with links to the decision record set
    index_of: docs/decisions
    required: true
    importance: required

  - path: steward.sln
    role: workflow
    description: .NET solution entry point for build, test, and IDE loading
    required: true
    importance: required

  # Requirements and repository contract
  - path: repository-steward-master-requirements.md
    role: requirements
    description: Original MRD source from which the PRD and traceability matrix are derived
    required: false
    importance: recommended

  - path: docs/requirements/requirements-traceability.md
    role: requirements
    description: Traceability matrix from MRD requirements to milestones and current implementation status
    required: false
    importance: recommended

  - path: docs/requirements/assumptions-constraints.md
    role: reference
    description: Assumptions, constraints, dependencies, and risks that shape implementation
    required: false
    importance: recommended

  # Roadmap and planning
  - path: docs/planning/implementation-instructions.md
    role: guide
    description: Milestone-by-milestone implementation instructions for contributors continuing the roadmap
    required: false
    importance: recommended

  - path: docs/planning/milestone-plan.md
    role: milestones
    description: Milestone plan through v1.0.0 that explains delivered sequencing
    required: false
    importance: recommended

  - path: docs/planning/post-v1-milestone-plan.md
    role: roadmap
    description: Active post-v1 roadmap and backlog sequencing
    required: false
    importance: recommended

  - path: docs/planning/rfc-007-governance-enhancements-backlog.md
    role: roadmap
    description: Actionable backlog for accepted governance enhancements from RFC-007
    required: false
    importance: recommended

  # Audits
  - path: docs/audits/usability-review-2026-04-15.md
    role: audit
    description: Steward-on-Steward usability and configurability review for contributor experience
    required: false
    importance: recommended

  - path: docs/audits/repository-audit-2026-04-14.md
    role: audit
    description: Release-readiness audit and contract-alignment review for the current implementation
    required: false
    importance: recommended

  # Generated
  - path: STRUCTURE.md
    role: generated
    description: Generated repository map refreshed by steward maintain after structural changes
    required: false
    importance: recommended

governance:
  section_size_warning_threshold: 500
  start_here:
    - README.md
    - docs/implementation-status.md
    - docs/planning-index.md
    - docs/requirements/PRD.md

validation:
  disabled_rules: []

maintenance:
  artifacts:
    - id: structure
      path: STRUCTURE.md
      type: structure-document
      options:
        depth: 3
        exclude:
          - ".git/**"
          - "**/bin/**"
          - "**/obj/**"
          - "**/TestResults/**"
          - "**/publish/**"
          - ".steward/**"
