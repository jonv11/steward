repository:
  name: steward
  description: Self-dogfooded .NET repository for the Steward CLI, including product docs, governance records, source code, and fixture repos
  type: tool

artifacts:
  # Agent guidance entry points.
  - path: AGENTS.md
    role: guide
    description: Primary entry point for coding agents — what to read, what to do, and how to work in this repo
    required: true
    importance: required

  # Session-start spine and high-trust entry points.
  - path: README.md
    role: authoritative
    description: Project overview, local usage, contributor quick start, and primary landing page
    required: true
    importance: required

  - path: docs/planning-index.md
    role: guide
    description: Central navigation hub for requirements, decisions, planning, audits, and source material
    index_of: docs/planning
    required: true
    importance: required

  - path: docs/implementation-status.md
    role: current-state
    description: "Current release-line truth: implemented scope, version posture, and remaining pre-1.0 work"
    required: true
    importance: required
    freshness:
      max_age_days: 30

  - path: docs/planning/implementation-instructions.md
    role: workflow
    description: Contributor execution guide for the active pre-1.0 work and next-step priorities
    importance: recommended

  - path: docs/requirements/PRD.md
    role: vision
    description: Canonical product requirements and repository purpose
    required: true
    importance: required

  - path: docs/decisions/decision-index.md
    role: decision-log
    description: Index of accepted RFCs and ADRs with links to the decision record set
    index_of: docs/decisions
    required: true
    importance: required

  - path: steward.sln
    role: workflow
    description: Solution entry point for build, test, and IDE loading
    required: true
    importance: required

  # Repo governance surfaces that matter when maintaining Steward-on-Steward.
  - path: .steward/policy.yaml
    role: governance
    description: Repo-specific Steward contract for orientation, artifact roles, and maintenance behavior
    importance: recommended

  # Core requirements and repository contract.
  - path: repository-steward-master-requirements.md
    role: requirements
    description: Original MRD source from which the PRD and traceability matrix are derived
    importance: recommended

  - path: docs/requirements/requirements-traceability.md
    role: requirements
    description: Traceability matrix from MRD requirements to milestones and current implementation status
    importance: recommended

  # Key planning artifacts — only structurally essential ones, not every planning doc
  - path: docs/planning/milestone-plan.md
    role: milestones
    description: Delivered and planned pre-1.0 milestone sequencing from v0.1.0 onward
    importance: recommended

  - path: docs/planning/pre-1-0-readiness-plan.md
    role: roadmap
    description: Active pre-1.0 readiness plan and categorized remaining work before first stable shipment
    importance: recommended
    freshness:
      max_age_days: 45

  - path: docs/planning/workflow-guide.md
    role: workflow
    description: Canonical reference for how all categories of work should be performed — feature, bug fix, docs, review, release, governance
    importance: recommended

  - path: docs/planning/release-process.md
    role: workflow
    description: Authoritative operator guide for intentional public pre-1.0 releases
    importance: recommended

  - path: CHANGELOG.md
    role: changelog
    description: Canonical release-notes source for intentional versioned releases
    required: true
    importance: recommended

  # Generated orientation surfaces.
  - path: STRUCTURE.md
    role: generated
    description: Generated repository map refreshed by steward maintain after structural changes
    importance: recommended

  # Optional directory anchors shape orientation without overloading status output.
  - path: docs/requirements/
    role: requirements
    description: Requirements, assumptions, and traceability documents
    importance: optional

  - path: docs/decisions/
    role: governance
    description: Decision records root for indexes, ADRs, and RFCs
    importance: optional

  - path: docs/decisions/adrs/
    role: governance
    description: Architecture Decision Record collection
    importance: optional

  - path: docs/decisions/rfcs/
    role: governance
    description: Request for Comments collection
    importance: optional

  - path: docs/planning/
    role: workflow
    description: Active planning, execution guidance, release preparation, and roadmap material
    importance: optional

  - path: docs/audits/
    role: audit
    description: Assessments, review records, and supporting evidence for stewardship decisions
    importance: optional

  - path: docs/reviews/
    role: audit
    description: Config, contract, and rule-system reviews — active synthesis and stress-test documents
    importance: optional

artifact_families:
  - family: adr
    display_name: Architecture Decision Record
    match:
      path_pattern: "docs/decisions/adrs/ADR-*.md"
    role: governance
    importance: recommended
    naming_pattern: "^ADR-[0-9]{3}-[a-z0-9-]+\\.md$"
    title_pattern: "^ADR-[0-9]{3}: .+"
    frontmatter_schema:
      required: [type, status, category]
      allowed_values:
        type: [adr]
        status: [Draft, Proposed, Accepted, Superseded, Deprecated]
      deprecated_fields:
        date: last_updated

  - family: rfc
    display_name: Request for Comments
    match:
      path_pattern: "docs/decisions/rfcs/RFC-*.md"
    role: governance
    importance: recommended
    naming_pattern: "^RFC-[0-9]{3}-[a-z0-9-]+(?:-draft)?\\.md$"
    title_pattern: "^RFC-[0-9]{3}: .+"
    frontmatter_schema:
      required: [type, status, resolves]
      allowed_values:
        type: [rfc]
        status: [Draft, Proposed, Accepted, Superseded, Deprecated, Deferred]

  - family: planning
    display_name: Planning Document
    match:
      path_pattern: "docs/planning/*.md"
    role: workflow
    importance: optional
    frontmatter_schema:
      required: [type, status]
      allowed_values:
        type: [planning]
        status: [Draft, Active, Accepted, Completed, Superseded]
      allowed_fields: [type, status, description]
      deprecated_fields:
        document_id: ~
        version: ~

  - family: requirements
    display_name: Requirements Supporting Document
    match:
      path_pattern: "docs/requirements/*.md"
    role: requirements
    importance: optional
    frontmatter_schema:
      required: [type, status]
      allowed_values:
        type: [prd, requirements]
        status: [Draft, Accepted, Active, Superseded]

  - family: audit
    display_name: Audit / Review Record
    match:
      path_pattern: "docs/audits/*.md"
    role: audit
    importance: optional

  - family: review
    display_name: Config / Contract Review
    match:
      path_pattern: "docs/reviews/*.md"
    role: audit
    importance: optional
    frontmatter_schema:
      required: [type, status]
      allowed_values:
        type: [review, planning]
        status: [Draft, Active, Complete, Completed, Superseded]
      deprecated_fields:
        date: last_updated

  - family: skill
    display_name: Agent Skill
    match:
      path_pattern: ".agents/skills/**/SKILL.md"
    role: guide
    importance: recommended
    frontmatter_schema:
      required: [name, description]

governance:
  section_size_warning_threshold: 500
  frontmatter:
    auto_fields:
      last_updated: true
  start_here:
    - README.md
    - docs/planning-index.md
    - docs/implementation-status.md
    - docs/planning/implementation-instructions.md
    - docs/planning/workflow-guide.md
    - docs/requirements/PRD.md
    - steward.sln
  completion_policy:
    rules:
      - id: STWD-001
        description: required artifact(s) missing
      - id: STWD-007
        description: maintained artifact(s) stale -> run 'steward maintain --apply'
      - id: STWD-008
        description: broken internal link(s)
      - id: STWD-009
        description: broken artifact reference(s) in policy
      - id: STWD-012
        description: state or readiness document(s) stale -> refresh current repo truth

validation:
  disabled_rules: []
  path_overrides:
    - pattern: "tests/Steward.TestFixtures/Repos/**"
      disabled_rules:
        - STWD-013


maintenance:
  artifacts:
    - id: structure
      path: STRUCTURE.md
      type: structure-document
      options:
        depth: 3
        exclude:
          - "artifacts/**"
          - ".git/**"
          - "**/bin/**"
          - "node_modules/**"
          - "**/obj/**"
          - "**/TestResults/**"
          - "**/publish/**"
          - ".steward/**"
    - id: decision-rfc-index
      path: docs/decisions/decision-index.md
      type: directory-index
      source: "docs/decisions/rfcs/RFC-*.md"
      managed_section: decision-rfc-index
      sort: filename
    - id: decision-adr-index
      path: docs/decisions/decision-index.md
      type: directory-index
      source: "docs/decisions/adrs/ADR-*.md"
      managed_section: decision-adr-index
      sort: filename
