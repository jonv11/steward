repository:
  name: steward
  description: Self-dogfooded .NET repository for the Steward CLI, its governing docs, and its test suite
  type: tool

artifacts:
  # Structurally required entry points — these are the repo's orientation spine
  - path: README.md
    role: authoritative
    description: Project overview, contributor quick start, command reference, and primary entry point
    required: true
    importance: required

  - path: docs/implementation-status.md
    role: current-state
    description: Authoritative pre-1.0 implementation snapshot, release-readiness state, and remaining gaps
    required: true
    importance: required
    freshness:
      max_age_days: 30

  - path: docs/planning-index.md
    role: guide
    description: Central navigation hub for requirements, decisions, planning, and audits
    index_of: docs/planning
    required: true
    importance: required

  - path: docs/requirements/PRD.md
    role: vision
    description: Canonical product requirements document and living product contract
    required: true
    importance: required

  - path: docs/decisions/decision-index.md
    role: decision-log
    description: Index of accepted RFCs and ADRs with links to the decision record set
    index_of: docs/decisions
    required: true
    importance: required

  - path: steward.sln
    role: workflow
    description: .NET solution entry point for build, test, and IDE loading
    required: true
    importance: required

  # Core requirements and repository contract
  - path: repository-steward-master-requirements.md
    role: requirements
    description: Original MRD source from which the PRD and traceability matrix are derived
    importance: recommended

  - path: docs/requirements/requirements-traceability.md
    role: requirements
    description: Traceability matrix from MRD requirements to milestones and current implementation status
    importance: recommended

  # Key planning artifacts — only structurally essential ones, not every planning doc
  - path: docs/planning/milestone-plan.md
    role: milestones
    description: Delivered and planned pre-1.0 milestone sequencing from v0.1.0 onward
    importance: recommended

  - path: docs/planning/pre-1-0-readiness-plan.md
    role: roadmap
    description: Active pre-1.0 readiness plan and categorized remaining work before first stable shipment
    importance: recommended

  # Generated
  - path: STRUCTURE.md
    role: generated
    description: Generated repository map refreshed by steward maintain after structural changes
    importance: recommended

  # Note: Individual audit files, planning detail docs, and per-ADR/RFC entries are
  # intentionally NOT listed here. They are discoverable by path convention and
  # governed by artifact_families below (ADRs and RFCs) or frontmatter_requirements
  # (requirements and planning). See RFC-008 §8 for the v0.13.0 scope.

artifact_families:
  - family: adr
    display_name: Architecture Decision Record
    match:
      path_pattern: "docs/decisions/adrs/ADR-*.md"
    role: governance
    importance: recommended
    frontmatter_schema:
      required: [type, status, category]
      allowed_values:
        type: [adr]
        status: [Draft, Proposed, Accepted, Superseded, Deprecated]

  - family: rfc
    display_name: Request for Comments
    match:
      path_pattern: "docs/decisions/rfcs/RFC-*.md"
    role: governance
    importance: recommended
    frontmatter_schema:
      required: [type, status, resolves]
      allowed_values:
        type: [rfc]
        status: [Draft, Proposed, Accepted, Superseded, Deprecated]

governance:
  section_size_warning_threshold: 500
  start_here:
    - README.md
    - docs/implementation-status.md
    - docs/planning-index.md
    - docs/requirements/PRD.md
  completion_policy:
    rules:
      - id: STWD-001
        description: required artifact(s) missing
      - id: STWD-007
        description: maintained artifact(s) stale -> run 'steward maintain --apply'
      - id: STWD-008
        description: broken internal link(s)
      - id: STWD-009
        description: broken artifact reference(s) in policy

validation:
  disabled_rules: []

  # Convention-based frontmatter enforcement by path pattern.
  # ADRs and RFCs are now governed by artifact_families above (v0.13.0).
  # Requirements and planning docs are still governed here by path pattern.
  #
  # Full required_sections enforcement is tracked as a later pre-1.0 gap
  # in pre-1-0-readiness-plan.md (v0.14.0+ per RFC-008 §3.3 and ADR-012).
  frontmatter_requirements:
    - pattern: "docs/requirements/**"
      required_fields:
        - type
        - status
      allowed_values:
        type: [prd, requirements]
        status: [Draft, Accepted, Active, Superseded]

    - pattern: "docs/planning/**"
      required_fields:
        - type
        - status
      allowed_values:
        type: [planning]
        status: [Draft, Active, Accepted, Completed, Superseded]

maintenance:
  artifacts:
    - id: structure
      path: STRUCTURE.md
      type: structure-document
      options:
        depth: 3
        exclude:
          - ".git/**"
          - "**/bin/**"
          - "**/obj/**"
          - "**/TestResults/**"
          - "**/publish/**"
          - ".steward/**"
