rulesets:
  - name: decision-doc-naming
    description: Keep ADR and RFC filenames stable and easy to scan in orient, search, and review.
    rules:
      - pattern: "docs/decisions/adrs/*.md"
        category: recommended
        must_match: "^ADR-[0-9]{3}-[a-z0-9-]+\\.md$"
      - pattern: "docs/decisions/rfcs/*.md"
        category: recommended
        must_match: "^RFC-[0-9]{3}-[a-z0-9-]+(?:-draft)?\\.md$"

  - name: project-and-history-naming
    description: Keep active project docs and archived evidence in stable lower-kebab-case filenames.
    rules:
      - pattern: "docs/project/*.md"
        category: recommended
        must_match: "^(?:README|[a-z0-9]+(?:-[a-z0-9]+)*)\\.md$"
      - pattern: "docs/history/audits/*.md"
        category: recommended
        must_match: "^[a-z0-9]+(?:-[a-z0-9]+)*(?:-[0-9]{4}-[0-9]{2}-[0-9]{2})?\\.md$"
      - pattern: "docs/history/reviews/*.md"
        category: recommended
        must_match: "^[a-z0-9]+(?:-[a-z0-9]+)*(?:-[0-9]{4}-[0-9]{2}-[0-9]{2})?\\.md$"
      - pattern: "docs/history/plans/*.md"
        category: recommended
        must_match: "^[a-z0-9]+(?:-[a-z0-9]+)*(?:-[0-9]{4}-[0-9]{2}-[0-9]{2})?\\.md$"
      - pattern: "docs/history/stubs/*.md"
        category: recommended
        must_match: "^[a-z0-9]+(?:-[a-z0-9]+)*(?:-[0-9]{4}-[0-9]{2}-[0-9]{2})?\\.md$"
